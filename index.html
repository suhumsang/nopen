<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NOpen</title>
<meta name="apple-mobile-web-app-title" content="NOpen">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --bg:#EFEBE2; --card:#FFFFFF; --line:#E5E5E5;
    --ink:#3B1F1C; --ink-soft:#8A7A70;
    --yellow:#F6E24D; --press:#D8CABF;
    --mint:#A8E6CF; --mint-deep:#2A9B71; --knob:rgba(246,226,77,.45);
    --surface:#F4F1EA; --bad:#C0392B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{touch-action:manipulation}
  html,body{margin:0;height:100%}
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:18px}
  @media (max-width:560px){ body{padding:0} }
  .phone{position:relative;width:100%;max-width:430px;height:min(900px,94vh);background:var(--bg);
    border-radius:30px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.18)}
  @media (max-width:560px){ .phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none} }
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px 20px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
  .screen.hidden{display:none !important}

  /* ===== 홈 ===== */
  #home .top{display:flex;align-items:center;justify-content:center;position:relative;margin:6px 0 18px}
  .brand{font-size:25px;font-weight:900;color:var(--ink);letter-spacing:.01em}
  .vmark{position:absolute;right:0;top:4px;font-size:10px;color:#BDB4A8;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;
    box-shadow:0 6px 18px rgba(0,0,0,.04)}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .calhead h2{margin:0;font-size:22px;font-weight:900;color:var(--ink)}
  .navbtns button{border:none;border-radius:14px;background:#f0ece3;color:var(--ink);
    font-size:13px;font-weight:800;cursor:pointer;padding:8px 12px}
  .week,.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .week span{font-size:13px;color:var(--ink-soft);font-weight:700;padding:4px 0}
  .dates{margin-top:4px}
  .dates .d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0}
  .dates .num{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;color:#bdb4a8}
  .dates .num.on{background:var(--ink);color:#fff}
  .dates .num.today{background:var(--ink);color:var(--yellow);box-shadow:0 0 0 3px rgba(246,226,77,.45)}
  .dates .dot{width:5px;height:5px;border-radius:50%;background:var(--ink);visibility:hidden}
  .dates .dot.show{visibility:visible}
  .streak{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:15px;font-weight:800;color:var(--ink)}
  .segs{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin:16px 0 12px}
  .segs i{height:13px;border-radius:7px;background:#eceadf}
  .segs i.fill{background:var(--ink)}
  .summary{font-size:14px;color:var(--ink-soft);font-weight:600}
  .summary b{color:var(--ink);font-weight:900;border-bottom:3px solid var(--yellow);padding-bottom:1px}
  .menu{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:22px 4px 0}
  .menu .m{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.5;cursor:default}
  .menu .m.act{opacity:1;cursor:pointer}
  .menu .ic{width:58px;height:58px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .menu .lbl{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .cheer{flex:1;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--ink);min-height:60px}
  .cta{border:none;cursor:pointer;background:var(--ink);color:#fff;font-size:18px;font-weight:400;
    padding:20px;border-radius:30px;width:100%;box-shadow:0 8px 22px rgba(59,31,28,.28);transition:transform .06s}
  .cta:active{transform:translateY(2px)}
  .cta.sub{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line);margin-top:10px}

  /* ===== 목록 공통 ===== */
  .plainlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .plainlist .row{display:flex;align-items:center;gap:14px;padding:12px 8px 12px 6px;
    border-bottom:1px solid var(--line);cursor:pointer}
  .plainlist .row .no{font-size:24px;font-weight:300;color:var(--ink);min-width:44px;line-height:1}
  .plainlist .row .no small{font-size:13px;font-weight:600;color:var(--ink-soft);margin-left:2px}
  .plainlist .row .mid{flex:1}
  .plainlist .row .t1{font-size:17px;font-weight:300;color:var(--ink)}
  .plainlist .row .t2{margin-top:3px;font-size:8pt;color:#8c8c8c;font-weight:600}
  .plainlist .row .t2 .lvnum{color:#2A9B71;font-weight:800}
  .plainlist .row .res{text-align:right;font-size:12px;color:var(--ink-soft);font-weight:600}
  .plainlist .row .res .ok{color:var(--mint-deep);font-weight:900;font-size:16px}
  .gradeb{font-weight:900;font-size:16px}
  .g-S{color:#C9A400}.g-A{color:#2A9B71}.g-B{color:#4A78C9}.g-C{color:#C97E2A}.g-D{color:#C0392B}
  .hdr2{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .hdr2 .back{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:20px;cursor:pointer;flex:none}
  .hdr2 h1{margin:0;font-size:20px;font-weight:900;color:var(--ink)}
  .hdr2 .rgt{font-size:13px;font-weight:800;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:6px 12px;cursor:pointer;flex:none}
  .hdr2 .rgt.off{opacity:.35;pointer-events:none}

  /* ===== 시작 위치 픽커 (3열 그리드 · 5세트 단위) ===== */
  #picker .pickbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .picklabel{font-size:13px;font-weight:800;color:var(--ink-soft);margin:10px 2px 8px}
  .wodgrid,.blockgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .wodgrid button,.blockgrid button{border:1px solid var(--line);border-radius:16px;background:var(--card);
    color:var(--ink);cursor:pointer;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .wodgrid button b{font-size:19px;font-weight:300}
  .wodgrid button i{font-style:normal;font-size:10px;font-weight:700;color:var(--ink-soft)}
  .wodgrid button i .okk{color:var(--mint-deep);font-weight:900}
  .blockgrid button{padding:13px 6px}
  .blockgrid button b{font-size:16px;font-weight:300}
  .wodgrid button.sel,.blockgrid button.sel{background:var(--ink);border-color:var(--ink)}
  .wodgrid button.sel b,.wodgrid button.sel i,.blockgrid button.sel b{color:#fff}
  .wodgrid button.sel i .okk{color:var(--yellow)}
  .blockgrid button.donea{background:var(--knob);border-color:var(--line)}
  .blockgrid button.donea.sel{background:var(--ink)}
  #picker .cta{margin-top:12px;flex:none}
  #picker .links2{text-align:center;padding:4px 0 0;flex:none}
  #picker .links2 button{border:none;background:none;color:#8A7A70;font-size:11px;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 7px}

  /* ===== 액션(키패드) ===== */
  #action{padding:0;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
  .actbar{display:flex;align-items:center;justify-content:space-between;padding:18px 22px}
  .actbar .x{font-size:26px;color:#3a3a3a;background:none;border:none;cursor:pointer;line-height:1;font-weight:300}
  .actbar .mid2{font-size:14px;color:#8a7a70;font-weight:700}
  .actbar .tm{font-size:14px;color:#8a7a70;font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
  #action .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 26px;
    transform:translateY(-30px)}
  .sum{display:inline-block;text-align:right;position:relative;padding-left:clamp(34px,9vw,46px)}
  .sum .ln{font-size:clamp(40px,11vw,52px);font-weight:300;color:#000;letter-spacing:.04em;line-height:1.15;
    display:flex;align-items:center;justify-content:flex-end;position:relative}
  .sum .ln .op{position:absolute;left:calc(-1*clamp(34px,9vw,46px))}
  .sum.retry .ln{color:var(--bad)}
  .sum.retry .rule{background:var(--bad)}
  .sum .op{font-weight:300}
  .sum .rule{height:2px;background:#000;margin-top:14px;margin-left:calc(-1*clamp(34px,9vw,46px));width:calc(100% + clamp(34px,9vw,46px))}
  .sum .ans-num{font-size:clamp(40px,11vw,52px);font-weight:300;color:#000;letter-spacing:.04em;
    line-height:1.15;margin-top:12px;min-height:1.15em;text-align:right}
  .sum .ans-num.bad{color:var(--bad)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);margin-top:auto;margin-bottom:0;
    background:var(--bg)}
  .keypad button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    border:none;border-top:3px solid var(--bg);border-right:3px solid var(--bg);
    background:#fff;font-size:clamp(28px,7.5vw,34px);font-weight:300;color:#000;
    height:clamp(65.9px,12.36vh,92.7px);cursor:pointer;transition:background .06s;
    display:flex;align-items:center;justify-content:center}
  .keypad button:nth-child(3n){border-right:none}
  .keypad button:active{background:var(--press)}
  .keypad .sm{font-size:clamp(24px,6vw,30px);font-weight:400}
  .keypad .blank{background:var(--bg);border:none;pointer-events:none}

  /* ===== 플래시(다항덧셈) ===== */
  #flash{padding:0}
  #flash .top,#cmp .top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px}
  #flash .top .x,#cmp .top .x{width:42px;height:42px;border-radius:50%;background:#efeae1;border:none;cursor:pointer;
    font-size:22px;color:var(--ink);display:flex;align-items:center;justify-content:center}
  #flash .top .name,#cmp .top .name{font-size:18px;font-weight:800;color:var(--ink-soft)}
  #flash .top .prog,#cmp .top .prog{font-size:20px;font-weight:900;color:var(--ink)}
  #flash .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 26px}
  #flash .box{width:100%;max-width:360px;height:clamp(180px,32vh,260px);background:var(--surface);border-radius:22px;
    display:flex;align-items:center;justify-content:center}
  #flash .box .num,#flash .box .q{font-size:clamp(72px,22vw,120px);font-weight:300;color:var(--ink);line-height:1}
  #flash .mine{margin-top:14px;font-size:16px;font-weight:700;color:var(--ink-soft);min-height:20px}
  #flash .mine.input{color:var(--ink);font-size:34px;font-weight:800}
  #flash .keypad{margin-bottom:0;border-bottom:none;transition:opacity .25s}
  #flash .keypad.lock{opacity:.32;pointer-events:none}
  #flash .submit{margin:10px 18px;margin-bottom:calc(14px + env(safe-area-inset-bottom));
    border:none;border-radius:26px;padding:18px;font-size:18px;font-weight:900;cursor:pointer;
    background:#cfc8bd;color:#fff;transition:background .2s}
  #flash .submit.on{background:var(--ink)}

  /* ===== 비교 카드 ===== */
  #cmp{padding:0}
  #cmp .duelwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16px 16px}
  #cmp .timerrow{display:flex;justify-content:center;margin-bottom:14px}
  #cmp .qtimer{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-width:84px;text-align:center;color:var(--ink)}
  #cmp .cards{display:flex;gap:12px}
  #cmp .dcard{touch-action:manipulation;flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:18px;
    aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;position:relative;transition:transform .07s, background .1s, border-color .1s}
  #cmp .dcard:active{transform:scale(.97)}
  #cmp .dcard.correct{background:var(--knob);border-color:var(--ink)}
  #cmp .dcard.wrong{background:var(--ink);border-color:var(--ink)}
  #cmp .dcard.wrong .num,#cmp .dcard.wrong .den,#cmp .dcard.wrong .badge,#cmp .dcard.wrong .mline{color:var(--yellow)}
  #cmp .dcard.wrong .bar{background:var(--yellow)}
  #cmp .frac{display:flex;flex-direction:column;align-items:center;line-height:1}
  #cmp .num,#cmp .den{font-size:38px;font-weight:800;padding:0 6px;color:var(--ink);font-variant-numeric:tabular-nums}
  #cmp .bar{height:3px;background:var(--ink);width:84%;margin:8px 0;border-radius:2px}
  #cmp .mline{font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.35;text-align:center}
  #cmp .badge{position:absolute;top:10px;left:12px;font-size:12px;font-weight:900;color:var(--ink-soft)}

  /* ===== 결과 · 완주 ===== */
  #result .resin,#dayend .resin{margin:auto 0;text-align:center}
  .rg{font-size:64px;font-weight:900;color:var(--ink)}
  .rt2{font-size:18px;font-weight:300;color:var(--ink);margin-top:10px}
  .rd{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.8;font-weight:600}
  .rd b{color:var(--ink);font-weight:900;border-bottom:3px solid var(--yellow)}
  #result{overflow:hidden}
  #result .char,#dayend .char{position:absolute;left:50%;bottom:4%;width:70%;max-width:340px;
    transform:translateX(-50%) translateY(120%) scale(.6);
    opacity:0;pointer-events:none;z-index:30;filter:drop-shadow(0 12px 18px rgba(59,31,28,.25))}
  .char.show{animation:bounceIn 1.6s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes bounceIn{
    0%{opacity:0;transform:translateX(-50%) translateY(120%) scale(.6)}
    18%{opacity:1;transform:translateX(-50%) translateY(-12%) scale(1.06)}
    34%{transform:translateX(-50%) translateY(6%) scale(.97)}
    50%{transform:translateX(-50%) translateY(-6%) scale(1.03)}
    66%{transform:translateX(-50%) translateY(2%) scale(.99)}
    80%{transform:translateX(-50%) translateY(-2%) scale(1.01)}
    100%{opacity:1;transform:translateX(-50%) translateY(0%) scale(1)}
  }
  #result .char{bottom:185px;width:56%;max-width:270px}
  #dayend{overflow:hidden}
  #dayend .resin{position:absolute;top:22%;left:20px;right:20px;transform:translateY(-50%);margin:0}
  #dayend canvas#cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
  #dayend .homebtn{position:absolute;left:20px;right:20px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40}

  /* ===== 오답장 ===== */
  .wrow{border-bottom:1px solid var(--line);padding:12px 2px}
  .wrow .wm{font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:4px}
  .wrow .wm .rescue{color:#2A9B71;font-weight:900}
  .wrow .wm .kbad{color:#C0392B;font-weight:900}
  .wrow .wx{font-size:18px;font-weight:300;color:var(--ink)}
  .wrow .wa{font-size:12px;font-weight:700;margin-top:3px}
  .wa .no1{color:#C0392B}.wa .yes1{color:#2A9B71}
  .emptymsg{text-align:center;color:var(--ink-soft);font-weight:600;font-size:14px;margin-top:40px}

  /* ===== 인쇄(오답 PDF) ===== */
  #printArea{display:none}
  @media print{
    body{display:block;padding:0;background:#fff}
    .phone{display:none !important}
    #printArea{display:block;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111}
    #printArea h1{font-size:18pt;margin:0 0 4pt}
    #printArea .pmeta{font-size:9pt;color:#666;margin-bottom:12pt}
    #printArea table{width:100%;border-collapse:collapse;font-size:10.5pt}
    #printArea th,#printArea td{border:1px solid #bbb;padding:5pt 7pt;text-align:left}
    #printArea th{background:#f2f2f2;font-size:9pt}
    #printArea td.prob{font-size:12pt;letter-spacing:.02em}
    #printArea tr{page-break-inside:avoid}
  }
</style>
</head>
<body>
<div class="phone">

  <!-- 홈 (달력형 원본 복원) -->
  <section id="home" class="screen">
    <div class="top">
      <div class="brand">NOpen</div>
      <span class="vmark">v0.42</span>
    </div>
    <div class="card">
      <div class="calhead">
        <h2 id="calTitle">…</h2>
        <div class="navbtns"><button id="dayInfo"></button></div>
      </div>
      <div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="dates" id="dates"></div>
      <div class="segs" id="segs"></div>
      <div class="summary" id="summary"></div>
      <div class="streak"><span>⚡</span> <span id="streak">0</span> 연속 일수</div>
    </div>
    <nav class="menu">
      <div class="m"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20v-6M12 20V8M18 20v-9"/></svg></div><div class="lbl">순위</div></div>
      <div class="m"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l3-4 3 2 4-6"/></svg></div><div class="lbl">학습결과</div></div>
      <div class="m"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div><div class="lbl">달력</div></div>
      <div class="m"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="6" width="13" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg></div><div class="lbl">통계</div></div>
      <div class="m act" id="menu-wrong"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 8v4M12 16h.01"/></svg></div><div class="lbl">오답</div></div>
    </nav>
    <div class="cheer" id="cheer">오늘도 파이팅!</div>
    <button class="cta" id="ctaBtn">점증부하 암산으로 뇌력증강 고고!!</button>
  </section>

  <!-- 시작 위치 픽커 -->
  <section id="picker" class="screen hidden">
    <div class="hdr2"><div class="back" id="pickBack">‹</div><h1>시작 위치</h1><span class="rgt" id="pickSets">세트 목록</span></div>
    <div class="pickbody">
      <div class="picklabel">회차</div>
      <div class="wodgrid" id="wodGrid"></div>
      <div class="picklabel">세트 (5세트 단위)</div>
      <div class="blockgrid" id="blockGrid"></div>
    </div>
    <button class="cta" id="pickGo">문제 실행</button>
    <div class="links2">
      <button id="csvToday">오늘 결과 CSV</button><button id="bkExport">백업 내보내기</button><button id="bkImport">백업 복원</button><button id="wipeAll">기록 전체 초기화</button>
      <input type="file" id="bkFile" accept=".json,application/json" style="display:none">
    </div>
  </section>

  <!-- 세트 목록 -->
  <section id="sets" class="screen hidden">
    <div class="hdr2"><div class="back" id="setsBack">‹</div><h1 id="setsTitle">WOD</h1><span class="rgt off" id="wodRedo">회차 다시 풀기</span></div>

function typeLabel(t){return {add:'덧셈',sub:'뺄셈',mul:'곱셈',poly:'다항덧셈',frac:'분수비교',mulc:'곱셈비교'}[t]||t;}
function setLabel(st){
  var ts=[],seen={};
  for(var i=0;i<st.ps.length;i++){var t=st.ps[i].t;if(!seen[t]){seen[t]=1;ts.push(t);}}
  if(ts.length===2&&seen.add&&seen.sub)return '덧뺄셈';
  return ts.map(typeLabel).join('·');
}
function gradeOf(t,cuts){
  if(t<=cuts[0])return 'S';
  if(t<=cuts[1])return 'A';
  if(t<=cuts[2])return 'B';
  if(t<=cuts[3])return 'C';
  return 'D';
}
function fmtSec(s){
  if(s>=60){var m=Math.floor(s/60);return m+'분 '+(s-60*m).toFixed(0)+'초';}
  return s.toFixed(1)+'초';
}
function probText(p){
  if(p.t==='add')return p.a+' + '+p.b+' = '+p.ans;
  if(p.t==='sub')return p.a+' − '+p.b+' = '+p.ans;
  if(p.t==='mul')return p.a+' × '+p.b+' = '+p.ans;
  if(p.t==='poly')return p.terms.join(' + ')+' = '+p.ans;
  if(p.t==='frac')return p.l[0]+'/'+p.l[1]+' □ '+p.r[0]+'/'+p.r[1]+'  (답 '+p.ans+')';
  return p.l[0]+'×'+p.l[1]+' □ '+p.r[0]+'×'+p.r[1]+'  (답 '+p.ans+')';
}

/* ============ 셀프테스트 (node 겸용) ============ */
function selfTest(){
  var errs=[];
  var total=0,wods=NDB.length;
  if(wods!==15)errs.push('WOD수 '+wods);
  for(var wi=0;wi<NDB.length;wi++){
    var w=NDB[wi];
    for(var si=0;si<w.sets.length;si++){
      var st=w.sets[si];
      if(!st.cuts||st.cuts.length!==4)errs.push('cuts '+w.no+'-'+st.no);
      for(var pi=0;pi<st.ps.length;pi++){
        var p=st.ps[pi];total++;
        if(p.t==='add'&&p.a+p.b!==p.ans)errs.push('add '+w.no+'-'+st.no+'-'+pi);
        else if(p.t==='sub'&&p.a-p.b!==p.ans)errs.push('sub '+w.no+'-'+st.no+'-'+pi);
        else if(p.t==='mul'&&p.a*p.b!==p.ans)errs.push('mul '+w.no+'-'+st.no+'-'+pi);
        else if(p.t==='poly'){
          var s=0;for(var k=0;k<p.terms.length;k++)s+=p.terms[k];
          if(s!==p.ans)errs.push('poly '+w.no+'-'+st.no+'-'+pi);
          if(p.terms.length!==5)errs.push('poly항수 '+w.no+'-'+st.no+'-'+pi);
        }
        else if(p.t==='frac'||p.t==='mulc'){
          var vl,vr;
          if(p.t==='frac'){vl=p.l[0]/p.l[1];vr=p.r[0]/p.r[1];}
          else{vl=p.l[0]*p.l[1];vr=p.r[0]*p.r[1];}
          if((vl<vr?'<':'>')!==p.ans)errs.push('cmp '+w.no+'-'+st.no+'-'+pi);
        }
        else if(['add','sub','mul','poly','frac','mulc'].indexOf(p.t)<0)errs.push('type? '+p.t);
      }
    }
  }
  if(total!==6106)errs.push('총문항 '+total);
  if(gradeOf(10,[35,40,45,50])!=='S')errs.push('grade S');
  if(gradeOf(38,[35,40,45,50])!=='A')errs.push('grade A');
  if(gradeOf(51,[35,40,45,50])!=='D')errs.push('grade D');
  return errs;
}

var DBS=(function(){
  var data=null;
  function blank(){return {ver:2,done:{},cur:null,wrongLog:[],log:[]};}
  function load(){
    var raw=null;
    try{
      raw=localStorage.getItem(LSKEY);
      if(!raw){
        var old=localStorage.getItem(OLDKEY);
        if(old){localStorage.setItem(LSKEY,old);localStorage.removeItem(OLDKEY);raw=old;}
      }
      data=raw?JSON.parse(raw):blank();
    }catch(e){data=blank();}
    if(!data.done)data.done={};
    if(!data.wrongLog)data.wrongLog=[];
    if(!data.log)data.log=[];
    if(data.ver!==2){ /* v1 → v2 마이그레이션 */
      for(var k in data.done)if(data.done[k]===1)data.done[k]={g:null,t:null,wr:null,at:null};
      if(data.cur&&data.cur.elapsed===undefined)data.cur.elapsed=0;
      data.ver=2;
    }
    return data;
  }
  function save(){try{localStorage.setItem(LSKEY,JSON.stringify(data));}catch(e){}}
  return {get:function(){return data||load();},save:save,replace:function(d){data=d;save();}};
})();

var S={mode:'play',wod:0,set:0,pi:0,input:'',attempt:1,probWrong:0,setWrong:0,flashRun:0,
       elapsed:0,t0:0,running:false,lock:false,flashLock:true,flashTimers:[],
       rq:[],rqi:0};
var timerIv=0;
function curSet(){return setByNo(wodByNo(S.wod),S.set);}
function curProb(){
  if(S.mode==='retry'){var e=S.rq[S.rqi];return wodByNo(e.w).sets.filter(function(x){return x.no===e.s;})[0].ps[e.i];}
  return curSet().ps[S.pi];
}
function timeCommit(){
  if(S.running){var now=performance.now();S.elapsed+=(now-S.t0)/1000;S.t0=now;}
}
function timeStart(){S.t0=performance.now();S.running=true;}
function timeStop(){timeCommit();S.running=false;}
function timeNow(){return S.elapsed+(S.running?(performance.now()-S.t0)/1000:0);}
function startTimerUI(){
  clearInterval(timerIv);
  timerIv=setInterval(function(){
    if(S.mode!=='play')return;
    var t=timeNow().toFixed(1);
    $('actTime').textContent=t;
    $('cmpTimer').textContent=t;
  },200);
}

  if(document.hidden){if(S.running){timeCommit();saveCur();}}
  else if(S.running){S.t0=performance.now();}
});
function saveCur(){
  if(S.mode!=='play')return;
  var d=DBS.get();
  d.cur={wod:S.wod,set:S.set,pi:S.pi,elapsed:Math.round(S.elapsed*10)/10,wr:S.setWrong};
  DBS.save();
}

/* ============ 플레이 시작 · 진행 ============ */
function startSet(wno,sno,resume){
  var w=wodByNo(wno),st=w&&setByNo(w,sno);
  if(!st)return;
  S.mode='play';S.wod=wno;S.set=sno;S.input='';S.lock=false;S.flashRun=0;
  var d=DBS.get();
  if(resume&&d.cur&&d.cur.wod===wno&&d.cur.set===sno&&d.cur.pi<st.ps.length){
    S.pi=d.cur.pi;S.elapsed=d.cur.elapsed||0;S.setWrong=d.cur.wr||0;
  }else{
    S.pi=0;S.elapsed=0;S.setWrong=0;
  }
  timeStart();startTimerUI();
  saveCur();
  showProblem();
}
function clearFlashTimers(){
  for(var i=0;i<S.flashTimers.length;i++)clearTimeout(S.flashTimers[i]);
  S.flashTimers=[];
}
function showProblem(){
  var p=curProb();
  S.input='';S.attempt=1;S.probWrong=0;S.lock=false;
  clearFlashTimers();
  if(p.t==='poly'&&S.mode==='play'&&S.flashRun>=FLASH_REST_EVERY){showRest();return;}
  if(p.t==='poly')renderFlash(p);
  else if(p.t==='frac'||p.t==='mulc')renderCmp(p);
  else renderAction(p,false);
}
function progText(){
  if(S.mode==='retry')return '오답 다시 풀기 · '+(S.rqi+1)+' / '+S.rq.length;
  return 'WOD '+S.wod+' · SET '+S.set+' · '+(S.pi+1)+' / '+curSet().ps.length;
}
function logWrong(p,my){
  /* 오답 노트 기록: k=같은 회에 틀린 횟수(1 또는 2) */
  if(S.mode==='retry')return;
  var d=DBS.get(),e=S.mode==='retry'?null:{w:S.wod,s:S.set,i:S.pi,k:S.probWrong,my:String(my),at:new Date().toISOString()};
  d.wrongLog.push(e);
  DBS.save();
}
function advance(correct){
  if(S.mode==='retry'){
    if(correct){
      var e=S.rq[S.rqi],d=DBS.get();
      for(var i=0;i<d.wrongLog.length;i++){
        var x=d.wrongLog[i];
        if(x.w===e.w&&x.s===e.s&&x.i===e.i&&!x.res)x.res=new Date().toISOString();
      }
      DBS.save();
    }
    S.rqi++;
    if(S.rqi>=S.rq.length){exitToWrong();return;}
    showProblem();
    return;
  }
  var wasPoly=curSet().ps[S.pi]&&curSet().ps[S.pi].t==='poly';
  if(wasPoly)S.flashRun=(S.flashRun||0)+1;
  S.pi++;
  saveCur();
  if(S.pi>=curSet().ps.length)finishSet();
  else showProblem();
}
function finishSet(){
  timeStop();clearInterval(timerIv);
  var w=wodByNo(S.wod),st=curSet(),d=DBS.get();
  var t=Math.round(S.elapsed*10)/10,g=gradeOf(t,st.cuts);
  var wasComplete=wodComplete(w);
  d.done[keyOf(S.wod,S.set)]={g:g,t:t,wr:S.setWrong,at:new Date().toISOString()};
  d.log.push({w:S.wod,s:S.set,g:g,t:t,wr:S.setWrong,at:new Date().toISOString()});
  d.cur=null;
  DBS.save();
  var nowComplete=wodComplete(w);
  if(!wasComplete&&nowComplete)showDayend(w,g);
  else showResult(g,t);
}
function exitPlay(){
  clearFlashTimers();
  if(S.mode==='retry'){exitToWrong();return;}
  timeStop();clearInterval(timerIv);
  saveCur();
  openSets(S.wod);
}
function exitToWrong(){
  clearFlashTimers();clearInterval(timerIv);
  S.mode='play';
  renderWrong();show('wrong');
}

/* ============ 액션(키패드) — 덧·뺄·곱: 1차 오답=빨간 재출제, 2차 오답=넘어감 ============ */
function renderAction(p,red){
  $('actProg').textContent=progText();
  $('actTime').textContent=S.mode==='play'?timeNow().toFixed(1):'';
  var sum=$('actSum');
  sum.className=red?'sum retry':'sum';
  var op=p.t==='add'?'+':(p.t==='sub'?'−':'×');
  sum.innerHTML='<div class="ln"><span>'+p.a+'</span></div>'
    +'<div class="ln"><span class="op">'+op+'</span><span>'+p.b+'</span></div>'
    +'<div class="rule"></div><div class="ans-num" id="actAns">&nbsp;</div>';
  show('action');
}
function renderInput(){
  var el=$('actAns');
  el.classList.remove('bad');
  el.innerHTML=S.input===''?'&nbsp;':S.input;
}
function judgeAction(){
  var p=curProb(),ansStr=String(p.ans);
  if(S.input.length<ansStr.length)return;
  if(S.input===ansStr){
    playDing();
    if(S.probWrong>0)logWrong(p,S.lastMy);
    advance(S.probWrong===0||S.mode!=='retry'?true:true);
    return;
  }
  /* 오답 */
  S.probWrong++;S.lastMy=S.input;S.lock=true;
  var el=$('actAns');
  el.classList.add('bad');
  if(S.attempt===1){
    /* 1차: 같은 문제를 붉은 글씨로 재출제 */
    setTimeout(function(){
      S.attempt=2;S.input='';S.lock=false;
      renderAction(p,true);
    },WRONG_FLASH_MS);
  }else{
    /* 2차: 오답 기록 후 넘어감 */
    if(S.mode==='play')S.setWrong++;
    logWrong(p,S.input);
    setTimeout(function(){S.lock=false;advance(false);},WRONG_FLASH_MS);
  }
}
$('actPad').addEventListener('pointerdown',function(e){
  var b=e.target.closest('button');
  if(!b||S.lock)return;
  playTick();
  var k=b.getAttribute('data-k')||b.textContent;
  if(k==='DEL')S.input=S.input.slice(0,-1);
  else if(S.input.length<8)S.input+=k;
  renderInput();
  if(k!=='DEL')judgeAction();
});
$('actClose').addEventListener('click',function(){exitPlay();});

/* ============ 플래시 휴식 (2문제마다 · 타이머 정지) ============ */
function showRest(){
  timeStop();
  $('restProg').textContent=(S.pi+1)+' / '+curSet().ps.length;
  show('rest');
}
$('restGo').addEventListener('click',function(){
  S.flashRun=0;
  timeStart();
  renderFlash(curProb());
});
$('restClose').addEventListener('click',function(){exitPlay();});

/* ============ 플래시(다항덧셈) — 틀리면 내답→정답 표시 후 넘어감 ============ */
function renderFlash(p){
  $('flashProg').textContent=S.mode==='retry'?((S.rqi+1)+' / '+S.rq.length):((S.pi+1)+' / '+curSet().ps.length);
  S.flashLock=true;S.input='';
  var pad=$('flashPad'),sub=$('flashSubmit'),num=$('flashNum'),q=$('flashQ'),mine=$('flashMine');
  pad.classList.add('lock');sub.classList.remove('on');
  q.style.display='none';mine.className='mine';mine.textContent='집중!';
  num.style.display='block';num.style.visibility='hidden';
  show('flash');
  var i=0,myPi=S.pi,myMode=S.mode,myRqi=S.rqi;
  function alive(){return S.mode===myMode&&(myMode==='retry'?S.rqi===myRqi:S.pi===myPi)&&!$('flash').classList.contains('hidden');}
  function showNext(){
    if(!alive())return;
    if(i>=p.terms.length){
      num.style.display='none';q.style.display='block';
      S.flashLock=false;pad.classList.remove('lock');
      mine.textContent='내 답';return;
    }
    num.textContent=p.terms[i];num.style.visibility='visible';
    var dur=FLASH_TERM_MS;
    S.flashTimers.push(setTimeout(function(){
      num.style.visibility='hidden';i++;
      S.flashTimers.push(setTimeout(showNext,FLASH_GAP_MS));
    },dur));
  }
  S.flashTimers.push(setTimeout(showNext,500));
}
$('flashPad').addEventListener('pointerdown',function(e){
  var b=e.target.closest('button');
  if(!b||S.flashLock)return;
  playTick();
  var k=b.getAttribute('data-k')||b.textContent,mine=$('flashMine');
  if(k==='DEL')S.input=S.input.slice(0,-1);
  else if(S.input.length<9)S.input+=b.textContent;
  if(S.input){mine.className='mine input';mine.textContent=S.input;}
  else{mine.className='mine';mine.textContent='내 답';}
  $('flashSubmit').classList.toggle('on',S.input.length>0);
});
$('flashSubmit').addEventListener('pointerdown',function(){
  if(S.flashLock||!S.input)return;
  var p=curProb(),v=S.input;
  if(v===String(p.ans)){playDing();advance(true);return;}
  /* 오답: 내답→정답 표시 후 넘어감 */
  S.flashLock=true;S.probWrong=1;
  $('flashPad').classList.add('lock');$('flashSubmit').classList.remove('on');
  $('flashMine').className='mine input';
  $('flashMine').innerHTML='<span style="color:#C0392B">'+v+'</span> → <span style="color:#2A9B71">정답 '+p.ans+'</span>';
  buzz(30);
  if(S.mode==='play')S.setWrong++;
  logWrong(p,v);
  S.flashTimers.push(setTimeout(function(){advance(false);},FLASH_REVEAL_MS));
});
$('flashClose').addEventListener('click',function(){exitPlay();});

/* ============ 비교 카드 — 틀리면 정답 카드 표시 후 넘어감 ============ */
function renderCmp(p){
  $('cmpName').textContent=typeLabel(p.t);
  $('cmpProg').textContent=S.mode==='retry'?((S.rqi+1)+' / '+S.rq.length):((S.pi+1)+' / '+curSet().ps.length);
  $('cmpTimer').style.visibility=S.mode==='play'?'visible':'hidden';
  $('cardAin').innerHTML=cardHTML(p,p.l);
  $('cardBin').innerHTML=cardHTML(p,p.r);
  $('cardA').className='dcard';$('cardB').className='dcard';
  show('cmp');
}
function cardHTML(p,side){
  if(p.t==='frac')
    return '<div class="frac"><span class="num">'+side[0]+'</span><span class="bar"></span><span class="den">'+side[1]+'</span></div>';
  return '<div class="mline">'+side[0]+'<br>×'+side[1]+'</div>';
}
function pickCard(which){
  if(S.lock)return;
  var p=curProb();
  var correct=p.ans==='<'?'B':'A';
  if(which===correct){playDing();advance(true);return;}
  /* 오답: 내 카드=오답 표시, 정답 카드 표시 후 넘어감 */
  S.lock=true;S.probWrong=1;
  $(which==='A'?'cardA':'cardB').classList.add('wrong');
  $(correct==='A'?'cardA':'cardB').classList.add('correct');
  buzz(30);
  if(S.mode==='play')S.setWrong++;
  logWrong(p,which);
  setTimeout(function(){S.lock=false;advance(false);},CMP_REVEAL_MS);
}
$('cardA').addEventListener('pointerdown',function(){pickCard('A');});
$('cardB').addEventListener('pointerdown',function(){pickCard('B');});
$('cmpClose').addEventListener('click',function(){exitPlay();});

/* ============ 결과 · 완주 ============ */
function showResult(g,t){
  var w=wodByNo(S.wod);
  $('resin').innerHTML='<div class="rg g-'+g+'">'+g+'</div>'
    +'<div class="rt2">'+fmtSec(t)+'</div>'
    +'<div class="rd">WOD '+S.wod+' · SET '+S.set+' · 오답 <b>'+S.setWrong+'</b>문제<br>'
    +'S ~'+curSet().cuts[0]+'초 · A ~'+curSet().cuts[1]+'초 · B ~'+curSet().cuts[2]+'초 · C ~'+curSet().cuts[3]+'초</div>';
  var ch=$('resChar');
  ch.className='char';
  if(g==='D'){ /* 잘하자 1000ton (무음) */
    ch.src=IMG_HAMMER;
    setTimeout(function(){ch.className='char show';},60);
  }else{ch.removeAttribute('src');}
  var idx=-1;
  for(var ii=0;ii<w.sets.length;ii++)if(w.sets[ii].no===S.set)idx=ii;
  $('resNext').style.display=(idx>=0&&idx+1<w.sets.length)?'':'none';
  show('result');
}
$('resNext').addEventListener('click',function(){
  /* 다음 세트 = 순번상 다음 (완료 여부 무관, 이어지는 흐름) */
  var w=wodByNo(S.wod),idx=-1;
  for(var ii=0;ii<w.sets.length;ii++)if(w.sets[ii].no===S.set)idx=ii;
  if(idx<0||idx+1>=w.sets.length){openSets(S.wod);return;}
  startSet(S.wod,w.sets[idx+1].no,false);
});
$('resSets').addEventListener('click',function(){openSets(S.wod);});

function showDayend(w,lastG){
  var d=DBS.get(),tot=0,n=0;
  for(var i=0;i<w.sets.length;i++){
    var rec=d.done[keyOf(w.no,w.sets[i].no)];
    if(rec&&rec.t){tot+=rec.t;n++;}
  }
  $('dayendIn').innerHTML='<div class="rg">WOD '+w.no+' 완주!</div>'
    +'<div class="rt2">'+w.sets.length+'세트 · 총 '+fmtSec(tot)+'</div>';
  show('dayend');
  var ch=$('dayChar');
  ch.src=IMG_WELL; /* 잘했어!!! */
  ch.className='char';
  setTimeout(function(){ch.className='char show';},80);
  playBuf('wow',GAIN_WOW);
  setTimeout(function(){playBuf('clap',GAIN_CLAP);},300);
  runConfetti();
}
$('dayendHome').addEventListener('click',function(){
  stopConfetti();
  renderHome();show('home');
});
var cfRaf=0;
function runConfetti(){
  var cv=$('cf'),ctx=cv.getContext('2d');
  var W=cv.width=cv.clientWidth||430,H=cv.height=cv.clientHeight||900;
  var colors=['#F6E24D','#A8E6CF','#2A9B71','#3B1F1C','#D8CABF','#C0392B'];
  var ps=[];
  for(var i=0;i<240;i++)ps.push({
    x:Math.random()*W,y:-20-Math.random()*H*0.6,
    w:5+Math.random()*6,h:8+Math.random()*8,
    c:colors[i%colors.length],
    vy:2+Math.random()*3.4,vx:-1+Math.random()*2,
    rot:Math.random()*Math.PI,vr:-0.12+Math.random()*0.24
  });
  var t0=performance.now();
  (function frame(now){
    ctx.clearRect(0,0,W,H);
    var done=true;
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      if(p.y<H+30)done=false;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if(!done&&now-t0<9000)cfRaf=requestAnimationFrame(frame);
    else ctx.clearRect(0,0,W,H);
  })(t0);
}
function stopConfetti(){cancelAnimationFrame(cfRaf);}

/* ============ 오답장 ============ */
function findProb(e){
  var w=wodByNo(e.w);if(!w)return null;
  var st=setByNo(w,e.s);if(!st)return null;
  return st.ps[e.i]||null;
}
function renderWrong(){
  var d=DBS.get(),list=d.wrongLog.slice().reverse(),html='';
  var unresolved=0;
  for(var i=0;i<list.length;i++){
    var e=list[i],p=findProb(e);
    if(!p)continue;
    if(!e.res)unresolved++;
    var when=e.at?e.at.slice(0,16).replace('T',' '):'';
    html+='<div class="wrow">'
      +'<div class="wm">WOD '+e.w+' · SET '+e.s+' · '+when
      +(e.k>=2?' · <span class="kbad">2번 틀림</span>':'')
      +(e.res?' · <span class="rescue">해결</span>':'')+'</div>'
      +'<div class="wx">'+probText(p)+'</div>'
      +(e.my!==undefined?'<div class="wa"><span class="no1">내 답 '+e.my+'</span></div>':'')
      +'</div>';
  }
  $('wrongList').innerHTML=html||'<div class="emptymsg">틀린 문제가 없어. 훌륭해!</div>';
  $('wrongRetry').classList.toggle('off',unresolved===0);
  $('wrongPdf').classList.toggle('off',!html);
}
$('wrongBack').addEventListener('click',function(){renderHome();show('home');});
$('wrongRetry').addEventListener('click',function(){
  var d=DBS.get(),seen={},q=[];
  for(var i=0;i<d.wrongLog.length;i++){
    var e=d.wrongLog[i];
    if(e.res)continue;
    var k=e.w+'-'+e.s+'-'+e.i;
    if(seen[k])continue;
    seen[k]=1;
    if(findProb(e))q.push({w:e.w,s:e.s,i:e.i});
  }
  if(!q.length)return;
  S.mode='retry';S.rq=q;S.rqi=0;S.input='';S.lock=false;
  clearInterval(timerIv);
  showProblem();
});

/* ============ 오답 PDF (인쇄 CSS 방식) ============ */
$('wrongPdf').addEventListener('click',function(){
  var d=DBS.get(),rows='';
  for(var i=0;i<d.wrongLog.length;i++){
    var e=d.wrongLog[i],p=findProb(e);
    if(!p)continue;
    rows+='<tr><td class="prob">'+probText(p)+'</td>'
      +'<td>'+(e.my!==undefined?e.my:'')+'</td>'
      +'<td>'+(e.k>=2?'2번':'1번')+(e.res?' · 해결':'')+'</td>'
      +'<td>WOD '+e.w+' · SET '+e.s+'</td>'
      +'<td>'+(e.at?e.at.slice(0,10):'')+'</td></tr>';
  }
  var now=new Date();
  $('printArea').innerHTML='<h1>NOpen 오답 노트</h1>'
    +'<div class="pmeta">출력: '+now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2)
    +' · 총 '+(rows?d.wrongLog.filter(function(e){return findProb(e);}).length:0)+'문제</div>'
    +'<table><tr><th>문제</th><th>내 답</th><th>틀림</th><th>위치</th><th>날짜</th></tr>'+rows+'</table>';
  window.print();
});

/* 테스트 훅 (Playwright 검증용 — 앱 동작에 영향 없음) */
window.NPW={curProb:curProb,openSets:openSets,showResult:showResult,timeNow:timeNow,startSet:startSet,openPicker:openPicker};

/* ============ 부팅 무결성 ============ */
(function boot(){
  var need=['home','picker','sets','action','flash','cmp','result','dayend','wrong','rest'];
  var miss=[];
  for(var i=0;i<need.length;i++)if(!document.getElementById(need[i]))miss.push(need[i]);
  if(miss.length!==0)throw new Error('화면 누락: '+miss.join(','));
  var errs=selfTest();
  if(errs.length)throw new Error('데이터 무결성 실패: '+errs.slice(0,5).join(' | '));
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    try{navigator.serviceWorker.register('sw.js');}catch(e){}
  }
  renderHome();
  show('home');
})();

}
